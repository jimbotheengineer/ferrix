[package]
name = "ferrix-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Benchmark harness and data generator for Ferrix"

[dependencies]
ferrix-core.workspace = true
ferrix-io.workspace = true
ferrix-formula.workspace = true

[[bin]]
name = "gen-data"
path = "src/gen_data.rs"

[[bin]]
name = "bench-load"
path = "src/bench_load.rs"

[[bin]]
name = "check-order"
path = "src/check_order.rs"

[[bin]]
name = "panic-probe"
path = "src/panic_probe.rs"

[[bin]]
name = "render-charts"
path = "src/render_charts.rs"

[[bin]]
name = "bench-chart"
path = "src/bench_chart.rs"

[[bin]]
name = "check-export"
path = "src/check_export.rs"

[[bin]]
name = "check-compact"
path = "src/check_compact.rs"

[[bin]]
name = "check-persist"
path = "src/check_persist.rs"

[[bin]]
name = "bench-mmap"
path = "src/bench_mmap.rs"

[[bin]]
name = "bench-filter"
path = "src/bench_filter.rs"

[[bin]]
name = "make-fixture"
path = "src/make_fixture.rs"
