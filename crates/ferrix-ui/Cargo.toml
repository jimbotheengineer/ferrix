[package]
name = "ferrix-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "egui/eframe front-end for Ferrix"

[[bin]]
name = "ferrix"
path = "src/main.rs"

[dependencies]
ferrix-core.workspace = true
ferrix-io.workspace = true
ferrix-formula.workspace = true
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.29"
rfd = "0.15"
