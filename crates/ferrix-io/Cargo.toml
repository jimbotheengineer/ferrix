[package]
name = "ferrix-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "File format ingest/export for Ferrix (CSV now, xlsx next)"

[dependencies]
# Arrow/Parquet import+export (issue #32). `arrow` is pulled in for the
# in-memory RecordBatch/array types the parquet reader and writer exchange;
# `parquet` for the file format itself. Default features are off to avoid
# dragging in the async/object-store/compute stacks we do not use — we only
# need the IPC ("arrow" file/stream) reader-writer and the base array kernels.
arrow = { version = "56", default-features = false, features = ["ipc"] }
calamine = "0.36"
chardetng = "0.1"
encoding_rs = "0.8"
ferrix-core.workspace = true
ferrix-formula.workspace = true
memmap2 = "0.9"
# Snappy is the default compression for interoperable Parquet; keeping it
# means files we write open in pandas/DuckDB/Spark without a codec error.
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }
# Reading table/validation/conditional-format parts needs the raw OOXML:
# calamine surfaces cell values, not the `xl/tables/*.xml` or `dataValidations`
# elements, and rust_xlsxwriter only writes. So the importer opens the package
# itself. Both crates are already in the tree via rust_xlsxwriter/calamine.
quick-xml = "0.41"
rayon = "1.10"
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
