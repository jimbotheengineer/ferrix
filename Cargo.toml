[workspace]
resolver = "2"
members = [
    "crates/ferrix-core",
    "crates/ferrix-io",
    "crates/ferrix-formula",
    "crates/ferrix-ui",
    "crates/ferrix-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license-file = "LICENSE.md"
repository = "https://github.com/jimbotheengineer/ferrix"
authors = ["Ferrix contributors"]

[workspace.dependencies]
ferrix-core = { path = "crates/ferrix-core" }
ferrix-io = { path = "crates/ferrix-io" }
ferrix-formula = { path = "crates/ferrix-formula" }

# Release profile tuned for throughput on very large datasets.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# NOT panic = "abort". Loading runs on a background thread, and the UI is
# written to survive it dying (poll_load handles a disconnected channel and
# reports "Load thread died"). Under abort a panic anywhere in that thread --
# a malformed file, a parser edge case -- kills the whole process instead,
# discarding unsaved edits and skipping the unsaved-changes prompt. Verified
# with panic-probe: abort exits 127 and never reaches the recovery path;
# unwind lets the main thread continue. The binary size and speed abort would
# save is not worth silently losing a user's work.
panic = "unwind"
strip = "symbols"

# Benchmarks want release-grade codegen. `panic` is inherited from release and
# must NOT be set here -- Cargo ignores the setting on the bench profile and
# warns about it on every build.
[profile.bench]
inherits = "release"
strip = "none"
debug = 1

# Dev builds are unusably slow on 10M-row data without optimized deps.
[profile.dev.package."*"]
opt-level = 3
