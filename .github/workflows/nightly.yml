name: nightly

# Every 12 hours, plus a manual trigger for testing.
#
# BUDGET NOTE: this repo is private on the free plan, which grants 2,000
# Actions minutes/month. Linux bills at 1x but **Windows bills at 2x**, so a
# naive matrix build twice a day would cost roughly:
#   (5 min Linux x 1) + (6 min Windows x 2) = 17 min per run
#   17 x 60 runs/month = ~1,020 min/month
# That is half the budget spent even on days when nothing changed. So the
# `changes` job below checks whether any commit landed since the last nightly
# tag and skips the whole build when the tree is identical. On an idle day the
# cost is a few seconds of a Linux runner.
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if there are no new commits'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  changes:
    name: check for new commits
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced by workflow_dispatch"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The nightly release records the commit it was built from in its
          # body. If that matches HEAD, nothing has changed and there is
          # nothing worth spending runner minutes on.
          PREV=$(gh release view nightly --json body -q .body 2>/dev/null \
                 | grep -oE 'built-from: [0-9a-f]{40}' | cut -d' ' -f2 || true)
          if [ "$PREV" = "$SHA" ]; then
            echo "no new commits since $PREV — skipping build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "new commits since ${PREV:-<none>} — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            bin: ferrix
            archive: ferrix-linux-x86_64.tar.gz
          - os: windows-latest
            label: windows-x86_64
            bin: ferrix.exe
            archive: ferrix-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # eframe/egui needs a windowing and GL stack to LINK on Linux, even
      # though the binary is never run here. Without these the Linux leg fails
      # at link time with missing -lxkbcommon / -lgtk-3.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.label }}

      # Build only the GUI binary. The bench/check binaries are development
      # tools and would add minutes for no user-facing benefit.
      - name: Build release binary
        run: cargo build --release --locked -p ferrix-ui --bin ferrix

      # A release that does not pass its own tests is worse than no release.
      - name: Test
        run: cargo test --workspace --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/
          cp README.md LICENSE.md dist/
          tar -C dist -czf ${{ matrix.archive }} .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/${{ matrix.bin }} dist/
          Copy-Item README.md,LICENSE.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }} -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 14

  release:
    name: publish nightly
    needs: [changes, build]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA='${{ needs.changes.outputs.sha }}'
          SHORT='${{ needs.changes.outputs.short }}'
          DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
          SUBJECT=$(git log -1 --pretty=%s "$SHA")

          # `built-from:` is machine-read by the `changes` job above to decide
          # whether the next scheduled run has anything to do. Keep the format.
          cat > notes.md <<EOF
          Automated build of \`main\` — not a stable release.

          | | |
          |---|---|
          | Commit | \`$SHORT\` |
          | Built | $DATE |
          | Latest change | $SUBJECT |

          Downloads below are built and tested on Linux and Windows.

          built-from: $SHA
          EOF

          # A rolling tag: one "nightly" release, replaced each time, so the
          # release list does not accumulate hundreds of entries.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --title "Nightly ($SHORT)" \
            --notes-file notes.md \
            --prerelease \
            --target "$SHA" \
            artifacts/*
